# Runtime settings for the aireos-api Cloud Run service.
#   gcloud run deploy aireos-api ... --env-vars-file=deploy/api.env.yaml
#
# Resource names only -- nothing here is secret, so it is committed. The app has
# no API keys: Gemini on Vertex AI signs in as the service account too. A future
# secret would come from Secret Manager via --set-secrets.
#
# Do NOT set GOOGLE_APPLICATION_CREDENTIALS or SERVICE_ACCOUNT_KEY_PATH: the
# service authenticates as its own service account (aireos-api@).

GCP_PROJECT_ID: aire-data

# ---- Cloud Storage ----
GCS_BUCKET_NAME: teamwipdev
GCS_DESTINATION_PREFIX: uploads/
GCS_DESTINATION_PREFIX_MAPPING: mappings/

# ---- Cloud SQL ----
POSTGRESQL_INSTANCE_CONNECTION_NAME: aire-data:us-central1:aire-postgresql
DB_NAME: promotions
# IAM database user = the service account email without .gserviceaccount.com
DB_IAM_USER: aireos-api@aire-data.iam
CLOUD_SQL_LOAD_ENABLED: "true"

# ---- AI ----
MAPPING_MODEL: gemini-3.8-flash
MAPPING_VERTEX_LOCATION: global
GCP_VERTEX_LOCATION: us-central1

# ---- HTTP ----
# The domain users open. Calls are same-origin behind the load balancer; this
# is the safety net for anything else.
CORS_ALLOWED_ORIGINS: https://aireos.example.com

# ---- Google Workspace SSO ----
# The domain users open (same as above), no trailing slash. Must match the
# frontend image's NEXT_PUBLIC_API_URL build arg.
AUTH_ENABLED: "true"
AUTH_FRONTEND_URL: https://aireos.example.com
AUTH_ALLOWED_DOMAIN: shop-aire.com
# The browser only talks to the load balancer over https, so the session cookie
# must be https-only. Leave AUTH_COOKIE_DOMAIN unset: the cookie is host-only,
# which is right while the app and API share one domain.
AUTH_COOKIE_SECURE: "true"
# Must exactly match an authorised redirect URI on the Google OAuth client.
GOOGLE_OAUTH_REDIRECT_URI: https://aireos.example.com/api/auth/callback
# Not secret (it appears in the sign-in URL), so it lives here.
GOOGLE_OAUTH_CLIENT_ID: REPLACE_WITH_CLIENT_ID.apps.googleusercontent.com
# AUTH_SESSION_SECRET and GOOGLE_OAUTH_CLIENT_SECRET are secrets: do not put
# them in this file. Pass them from Secret Manager when deploying:
#   --set-secrets=AUTH_SESSION_SECRET=aireos-auth-session-secret:latest,GOOGLE_OAUTH_CLIENT_SECRET=aireos-google-oauth-client-secret:latest
