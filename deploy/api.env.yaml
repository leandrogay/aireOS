# Runtime settings for the aireos-api Cloud Run service.
#   gcloud run deploy aireos-api ... --env-vars-file=deploy/api.env.yaml
#
# Resource names only -- nothing here is secret, so it is committed. Secrets
# (ANTHROPIC_API_KEY) come from Secret Manager via --set-secrets.
#
# Do NOT set GOOGLE_APPLICATION_CREDENTIALS or SERVICE_ACCOUNT_KEY_PATH: the
# service authenticates as its own service account (aireos-api@).

GCP_PROJECT_ID: aire-data

# ---- Cloud Storage ----
GCS_BUCKET_NAME: teamwipdev
GCS_DESTINATION_PREFIX: uploads/
GCS_DESTINATION_PREFIX_MAPPING: mappings/

# ---- Cloud SQL ----
POSTGRESQL_INSTANCE_CONNECTION_NAME: aire-data:us-central1:aire-postgresql
DB_NAME: promotions
# IAM database user = the service account email without .gserviceaccount.com
DB_IAM_USER: aireos-api@aire-data.iam
CLOUD_SQL_LOAD_ENABLED: "true"

# ---- AI ----
MAPPING_PROVIDER: gemini
MAPPING_VERTEX_LOCATION: global
GCP_VERTEX_LOCATION: us-central1

# ---- HTTP ----
# The domain users open. Calls are same-origin behind the load balancer; this
# is the safety net for anything else.
CORS_ALLOWED_ORIGINS: https://aireos.example.com
