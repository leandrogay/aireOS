# Runtime settings for the Cloud Run jobs built from the API image
# (forecast-refresh, aireos-task).
#   gcloud run jobs deploy <job> ... --env-vars-file=deploy/jobs.env.yaml
#
# Same resources as deploy/api.env.yaml, but the jobs run as aireos-jobs@, so
# they log in to Cloud SQL as that user. Nothing here is secret.

GCP_PROJECT_ID: aire-data

# ---- Cloud Storage ----
# install_reference_contracts.py writes mappings/confirmed/ here.
GCS_BUCKET_NAME: teamwipdev
GCS_DESTINATION_PREFIX: uploads/
GCS_DESTINATION_PREFIX_MAPPING: mappings/

# ---- Cloud SQL ----
POSTGRESQL_INSTANCE_CONNECTION_NAME: aire-data:us-central1:aire-postgresql
DB_NAME: promotions
DB_IAM_USER: aireos-jobs@aire-data.iam
CLOUD_SQL_LOAD_ENABLED: "true"
