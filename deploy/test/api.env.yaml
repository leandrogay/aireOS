# Runtime settings for the aireos-api-test Cloud Run service. Applied by
# deploy/deploy.ps1 (or deploy.sh) with --env-vars-file, which REPLACES every
# env var on the service -- so a setting changed in the console is lost on the
# next deploy. Change it here instead.
#
# Nothing here is secret, so it is committed. Secrets are listed by name only in
# api.secrets.yaml and come from Secret Manager; a key must not be in both files.
#
# Do NOT set GOOGLE_APPLICATION_CREDENTIALS or SERVICE_ACCOUNT_KEY_PATH: the
# service authenticates as its own service account (aireos-api@).

GCP_PROJECT_ID: aire-data

# ---- Cloud Storage ----
GCS_BUCKET_NAME: teamwipdev
GCS_DESTINATION_PREFIX: uploads/
GCS_DESTINATION_PREFIX_MAPPING: mappings/

# ---- Cloud SQL ----
POSTGRESQL_INSTANCE_CONNECTION_NAME: aire-data:us-central1:aire-postgresql
DB_NAME: promotions
# IAM database user = the service account email without .gserviceaccount.com
DB_IAM_USER: aireos-api@aire-data.iam
CLOUD_SQL_LOAD_ENABLED: "true"
# "true": known layouts wait for a confirmed Load instead of loading on upload.
REQUIRE_LOAD_CONFIRMATION: "false"

# ---- AI ----
MAPPING_MODEL: gemini-3.8-flash
MAPPING_VERTEX_LOCATION: global
GCP_VERTEX_LOCATION: global

# ---- HTTP ----
# The web service's URL. The browser only talks to the web service, which
# forwards /api/* here (BACKEND_API_URL in web.build.env), so calls are
# same-origin; this is the safety net for anything else.
CORS_ALLOWED_ORIGINS: https://aireos-web-test-55957091068.asia-southeast1.run.app

# ---- Google Workspace SSO ----
# The web service's URL, no trailing slash: the session cookie is set on it.
AUTH_ENABLED: "true"
AUTH_FRONTEND_URL: https://aireos-web-test-55957091068.asia-southeast1.run.app
AUTH_ALLOWED_DOMAIN: shop-aire.com
# Cloud Run is https-only, so the session cookie must be too. Leave
# AUTH_COOKIE_DOMAIN unset: the cookie is host-only on the web service's URL.
AUTH_COOKIE_SECURE: "true"
# Must exactly match an authorised redirect URI on the Google OAuth client.
# It goes through the web service, so the cookie lands on the right host.
GOOGLE_OAUTH_REDIRECT_URI: https://aireos-web-test-55957091068.asia-southeast1.run.app/api/auth/callback
# Not secret (it appears in the sign-in URL), so it lives here.
GOOGLE_OAUTH_CLIENT_ID: 55957091068-p5q03j7ohigrko31gla8i1iqbudlp70a.apps.googleusercontent.com
