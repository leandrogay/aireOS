# Secrets for the aireos-api-test service: env var name -> Secret Manager
# secret:version. Names only -- the values live in Secret Manager and never in
# this repo. Create or rotate them with deploy/setup-secrets.ps1 (or .sh).
#
# Each environment has its own secrets (aireos-test-*, aireos-prod-*), so a
# test deploy can never read production credentials.

AUTH_SESSION_SECRET: aireos-test-auth-session-secret:latest
GOOGLE_OAUTH_CLIENT_SECRET: aireos-test-google-oauth-client-secret:latest
