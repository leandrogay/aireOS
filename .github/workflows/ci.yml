name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (lint + node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/aireos
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the web image (frontend/aireos/Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/aireos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pure app/utils helpers only (tests/*.test.mjs); needs no .env.frontend.
      - name: Run tests
        run: npm test
